{% extends "index.html" %}
{% load i18n %}
{% block title %}{% trans "Reset Password" %}{% endblock %}
{% block content %}
<div class="auth-container auth-page-bg min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="card auth-card border-0 shadow-lg p-5" style="max-width: 500px; width: 100%;">
        <h3 class="fw-black mb-3">{% trans "Reset Password" %}</h3>
        <p class="text-muted mb-4">{% trans "Enter your email address and we'll send you a link to reset your password." %}</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label fw-bold">{% trans "Email Address" %}</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow">
                {% trans "Send Reset Link" %}
            </button>
        </form>
    </div>
</div>
{% endblock %}
