{% load i18n %}
{% load static %}

<div class="card border-0 shadow-sm rounded-4 mb-4 overflow-hidden">
    <div class="items-section-header d-flex align-items-center justify-content-between px-4 py-3 border-bottom bg-white">
        <div class="d-flex align-items-center gap-3">
            <div class="bg-primary bg-opacity-10 rounded-3 p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                <i class="fas fa-layer-group text-primary"></i>
            </div>
            <div>
                <h5 class="fw-bold mb-0">{% trans "Variants" %}</h5>
                <span class="small text-muted" id="itemsCount">{% if items %}{{ items|length }}{% else %}0{% endif %} {% trans "items" %}</span>
            </div>
        </div>
        <button type="button" class="btn btn-dark rounded-pill px-4 fw-bold" id="addItemBtn"
                data-bs-toggle="modal" data-bs-target="#itemFormModal">
            <i class="fas fa-plus me-1"></i> {% trans "Add Variant" %}
        </button>
    </div>

    <div class="p-4 bg-light bg-opacity-25" id="itemsContainer"
         data-empty-text="{% trans "No variants yet. Click 'Add Variant' to create product options." %}">
        {% include "products/items/item_list_partial.html" with product=product %}
    </div>
</div>
