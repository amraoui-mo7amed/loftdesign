{% load i18n %}
{% load static %}

<div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
        <h5 class="fw-bold mb-0">
            <i class="fas fa-layer-group me-2"></i>{% trans "Product Items / Variants" %}
        </h5>
        <button type="button" class="btn btn-primary btn-sm rounded-pill px-3" id="addItemBtn"
                data-bs-toggle="modal" data-bs-target="#itemFormModal">
            <i class="fas fa-plus me-1"></i> {% trans "Add Item" %}
        </button>
    </div>

    <div id="itemsContainer"
         data-empty-text="{% trans "No items yet. Click 'Add Item' to create product variants." %}">
        {% include "products/items/item_list_partial.html" with product=product %}
    </div>
</div>
