{% load i18n %}
{% load static %}

<div class="d-flex align-items-center justify-content-between mb-3">
  <span class="small text-muted" id="itemsCount">{% if items %}{{ items|length }}{% else %}0{% endif %} {% trans "items" %}</span>
  <button type="button" class="btn btn-dark rounded-pill px-4 fw-bold btn-sm" id="addItemBtn"
          data-bs-toggle="modal" data-bs-target="#itemFormModal">
    <i class="fas fa-plus me-1"></i> {% trans "Add Variant" %}
  </button>
</div>
<div id="itemsContainer"
     data-empty-text="{% trans "No variants yet. Click 'Add Variant' to create product options." %}">
  {% include "products/items/item_list_partial.html" with product=product %}
</div>
