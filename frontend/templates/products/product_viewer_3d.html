<!DOCTYPE html>
{% load i18n %}
{% load static %}
<html lang="{{ LANGUAGE_CODE|default:'en' }}" dir="{{ LANGUAGE_BIDI|yesno:'rtl,ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{ product.title }} — {% trans "3D View" %}</title>
    <link rel="stylesheet" href="{% static "css/product_viewer.css" %}?v={% now "U" %}">
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.0/dist/model-viewer.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
        .viewer-fullscreen { width: 100vw; height: 100dvh; }
        .viewer-fullscreen model-viewer { width: 100%; height: 100%; }
        .viewer-close {
            position: fixed; top: 1rem; z-index: 10;
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.6rem 1.25rem; background: rgba(0,0,0,0.6);
            color: #fff; border: none; border-radius: 2rem;
            font-size: 0.9rem; font-weight: 700; cursor: pointer;
            text-decoration: none; backdrop-filter: blur(4px);
            transition: background 0.2s;
        }
        .viewer-close:hover { background: rgba(0,0,0,0.85); color: #fff; }
        [dir="ltr"] .viewer-close { left: 1rem; }
        [dir="rtl"] .viewer-close { right: 1rem; }
    </style>
</head>
<body>
    <a href="{% url 'frontend:product_detail' product.pk %}" class="viewer-close">
        <i class="fas fa-arrow-left"></i> {% trans "Back" %}
    </a>
    <div class="viewer-fullscreen">
        <model-viewer
            src="{{ product.model_3d.url }}"
            ar
            ar-modes="scene-viewer webxr quick-look"
            camera-controls
            auto-rotate
            shadow-intensity="1"
            environment-image="neutral"
        ></model-viewer>
    </div>
</body>
</html>
