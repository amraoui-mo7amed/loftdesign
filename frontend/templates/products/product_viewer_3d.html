<!DOCTYPE html>
{% load i18n %}
{% load static %}
<html lang="{{ LANGUAGE_CODE|default:'en' }}" dir="{{ LANGUAGE_BIDI|yesno:'rtl,ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{ product.title }} — {% trans "3D View" %}</title>
    <link rel="stylesheet" href="{% static "css/product_viewer.css" %}?v={% now "U" %}">
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.0/dist/model-viewer.min.js"></script>
</head>
<body>
    <a href="{% url 'frontend:product_detail' product.pk %}" class="viewer-close">
        <i class="fas fa-arrow-left"></i> {% trans "Back" %}
    </a>
    <div class="viewer-fullscreen">
        <model-viewer
            src="{{ product.model_3d.url }}"
            ar
            ar-modes="scene-viewer webxr quick-look"
            camera-controls
            auto-rotate
            shadow-intensity="1"
            environment-image="neutral"
        ></model-viewer>
    </div>
</body>
</html>
